- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true
# Only ViNote business tools are enabled. Runtime execution and persistence are
# supplied by the pinned SDK; no package-manager or Node installation is needed.
- id: tool-plugin-manager
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-agent-team
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-office
  disabled: true
- id: schedule
  disabled: true
- id: present
  disabled: true
- id: file-reference-local
  disabled: true
- id: agent-instructions
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.VINOTE_AGENT_SYSTEM_PROMPT
- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 1
- id: llm-pi-ai
  config:
    providers:
      vinote:
        api: openai-completions
        baseURL: !!js process.env.VINOTE_LLM_BASE_URL
        apiKeyEnv: VINOTE_LLM_API_KEY
        models:
          - id: !!js process.env.VINOTE_LLM_MODEL
            contextWindow: !!js Number(process.env.VINOTE_LLM_CONTEXT_WINDOW ?? 64000)
            maxTokens: !!js Number(process.env.VINOTE_LLM_MAX_TOKENS ?? 4096)
        timeoutMs: 120000
        streamIdleTimeoutMs: 60000
        retryPolicy:
          mode: normal
          maxRetries: 1
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          maxTokensField: max_tokens
- insert:
    - id: vinote-business-tools
      name: ./index.mjs
